<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="paint-window">
    <div class="menu-bar">
      <span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Options</span><span>Help</span>
    </div>

    <div class="main-workspace">
      <div class="sidebar">
        <div class="toolbox">
          <button data-tool="pencil" class="active">ดินสอ</button>
          <button data-tool="eraser">ยางลบ</button>
          <button data-tool="line">เส้นตรง</button>
          <button data-tool="rect">สี่เหลี่ยม</button>
          <button data-tool="ellipse">วงรี</button>
        </div>
        
        <div class="thickness-box">
          <div>ขนาดเส้น</div>
          <input type="range" id="lineWidth" min="1" max="10" value="1">
          <div id="widthDisplay">1px</div>
        </div>
      </div>

      <div class="canvas-area">
        <canvas id="canvas" width="400" height="300"></canvas>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="color-indicator">
        <div id="currentColor" style="background-color: #000000;"></div>
      </div>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
